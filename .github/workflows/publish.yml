name: screen-and-publish

# Runs the screen monthly, commits the updated cache, coordinates and site back
# to the repo (the site always changes via its Updated badge, so every run
# commits, which keeps the schedule from being disabled after 60 days of
# inactivity), and publishes the report to GitHub Pages.

on:
  schedule:
    # 03:17 UTC on the 1st of each month. Early and off the hour.
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Data source"
        type: choice
        options: [flatfox, mock, apify]
        default: flatfox
      all_cantons:
        description: "Sweep all target cantons in one run"
        type: boolean
        default: true

permissions:
  contents: write   # commit the refreshed cache and coordinates
  pages: write      # deploy to Pages
  id-token: write   # Pages OIDC

concurrency:
  group: screen-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pick the source: the manual input when present, otherwise Flatfox (free
      # public API). Scheduled runs always sweep every canton.
      - name: Resolve source
        id: src
        run: |
          SRC="${{ github.event.inputs.source }}"
          ALL="${{ github.event.inputs.all_cantons }}"
          if [ -z "$SRC" ]; then SRC="flatfox"; ALL="true"; fi
          echo "source=$SRC" >> "$GITHUB_OUTPUT"
          echo "all=$ALL" >> "$GITHUB_OUTPUT"
          echo "Using source: $SRC, all cantons: $ALL"

      - name: Run screen
        timeout-minutes: 60
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          ALL=""
          if [ "${{ steps.src.outputs.all }}" = "true" ]; then ALL="--all-cantons"; fi
          python -m swiss_screen.pipeline --source "${{ steps.src.outputs.source }}" $ALL

      - name: Commit refreshed cache, coordinates and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache.json data/commune_coords.csv site
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "chore: monthly refresh of cache, coordinates and site [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
